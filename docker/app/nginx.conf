# Adapted from the original Binder install gist. Single-container: nginx + php-fpm.
# fastcgi_pass targets php-fpm on 127.0.0.1:9000 (same container); root = /app.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
daemon off;

events { worker_connections 768; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 72M;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  upstream binder_backend { server 127.0.0.1:9000; }

  server {
    listen 80;
    root /app;
    server_name _;
    set $alt_request_uri $request_uri;

    location /drmc/ {
      error_page 404 = @drmc;
      log_not_found off;
      set $alt_request_uri /drmc/index;
    }
    location @drmc { rewrite ^/drmc/(.*)$ /index.php last; }

    location / { try_files $uri /index.php?$args; }

    location /sf/ { alias /app/vendor/symfony/data/web/sf/; }

    location ~ /\.            { deny all; return 404; }
    location ~* (\.yml|\.ini|\.tmpl)$ { deny all; return 404; }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; return 404; }

    location ~ /uploads/r/(.*)/conf { }
    location ~ ^/uploads/r/(.*)$ {
      include /etc/nginx/fastcgi_params;
      set $index /index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$index;
      fastcgi_param SCRIPT_NAME $index;
      fastcgi_pass binder_backend;
    }

    location ~ /private/ { internal; root /app/; }

    location ~ ^/(index|qubit_dev)\.php(/|$) {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param REQUEST_URI $alt_request_uri;
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      fastcgi_pass binder_backend;
    }

    location ~* \.php$ { deny all; return 404; }
  }
}
