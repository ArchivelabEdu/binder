# Adapted from the original Binder install gist. Single-container: nginx + php-fpm.
# fastcgi_pass targets php-fpm on 127.0.0.1:9000 (same container); root = /app.
#
# DEFAULT-DENY ROUTING (P2): only the DRMC Angular UI (/drmc), its REST API
# (/api) and static assets are exposed. The legacy AtoM server-rendered pages
# still use pre-ES-2.0 Elastica Facet/Filter APIs that fatal against the
# vendored Elastica 5.x (see docs-spike/es56-audit.md P2) — those routes are
# 404ed here instead of being ported to aggregations.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
daemon off;

events { worker_connections 768; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 72M;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  upstream binder_backend { server 127.0.0.1:9000; }

  server {
    listen 80;
    root /app;
    server_name _;
    set $alt_request_uri $request_uri;

    # Root: serves the redirect page to /drmc
    location = / { rewrite ^ /index.php last; }

    # DRMC Angular app (HTML5 mode: unknown paths re-enter at /drmc/index)
    location /drmc {
      error_page 404 = @drmc;
      log_not_found off;
      set $alt_request_uri /drmc/index;
      try_files $uri @drmc;
    }
    location @drmc { rewrite ^ /index.php last; }

    # REST API
    location /api/ { rewrite ^ /index.php last; }

    # Static assets used by the DRMC UI
    location /plugins/  { try_files $uri =404; }
    location /images/   { try_files $uri =404; }
    location /downloads/ { try_files $uri =404; }
    location = /favicon.ico { }
    location = /robots.txt  { }

    location ~* /(?:uploads|files)/.*\.php$ { deny all; return 404; }
    location ~ /uploads/r/(.*)/conf { }
    location ~ ^/uploads/r/(.*)$ {
      include /etc/nginx/fastcgi_params;
      set $index /index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$index;
      fastcgi_param SCRIPT_NAME $index;
      fastcgi_pass binder_backend;
    }

    location ~ /\.            { deny all; return 404; }
    location ~* (\.yml|\.ini|\.tmpl)$ { deny all; return 404; }

    # Block legacy-module access through front-controller path info
    # (e.g. /index.php/actor/browse) — only api/drmc may pass through.
    location ~ ^/(index|qubit_dev)\.php/(?!api/|drmc) { return 404; }

    location ~ ^/(index|qubit_dev)\.php(/|$) {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param REQUEST_URI $alt_request_uri;
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      fastcgi_pass binder_backend;
    }

    location ~* \.php$ { deny all; return 404; }

    # Everything else — including all legacy AtoM routes — is not exposed.
    location / { return 404; }
  }
}
