; Binder spike PHP settings (dev). Errors visible to speed up debugging.
memory_limit = 512M
max_execution_time = 120
post_max_size = 72M
upload_max_filesize = 64M
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = UTC
cgi.fix_pathinfo = 0
